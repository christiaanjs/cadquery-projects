[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cqp"
version = "0.1.0"
description = "Tooling for parametric CadQuery projects: builds, drawings, 3D viewer and a static site"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.4",
    "cairosvg>=2.7",
    "markdown>=3.5",
    "flask>=3.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
pyvista = ["pyvista", "numpy"]

[project.scripts]
cqp = "cqp.cli:main"

[tool.setuptools]
packages = ["cqp"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "build", "_site", "viewer", "projects/*/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines in embedded HTML/CSS
# Model files are scripts: allow non-top imports / star-ish idioms there.
[tool.ruff.lint.per-file-ignores]
"projects/**" = ["E402", "F821", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
