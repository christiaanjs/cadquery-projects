# Publishes the site to GitHub Pages (free) from the gh-pages branch:
#   main  -> https://<owner>.github.io/<repo>/
#   PR #n -> https://<owner>.github.io/<repo>/pr-<n>/   (removed when the PR closes)
#
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root).
name: Site

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write        # push to gh-pages
  pull-requests: write   # PR preview comment

concurrency:
  group: site-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libgl1 libglib2.0-0

      - run: pip install -e .

      - name: Build site
        run: cqp site --out _site

      - name: Deploy main to site root
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true          # keep pr-* preview directories

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment preview links on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const base = `https://${owner}.github.io/${repo}/pr-${pr}`;
            const marker = '<!-- cqp-preview-bot -->';
            const projects = JSON.parse(fs.readFileSync('_site/projects.json', 'utf8'));
            const rows = projects.map(p => `| **${p.title}** | [${base}/${p.slug}/](${base}/${p.slug}/) |`).join('\n');
            const body = [
              marker, '## Preview', '', `[All projects](${base}/)`, '',
              '| Project | Page |', '|---|---|', rows, '',
              `Commit \`${sha}\` · updated ${new Date().toUTCString()}`,
              '', '_The first deploy can take a minute or two to appear on GitHub Pages._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
        continue-on-error: true      # branch does not exist yet -> nothing to clean

      - name: Remove preview directory
        run: |
          PR="${{ github.event.pull_request.number }}"
          if [ ! -d "pr-${PR}" ]; then echo "no preview for PR ${PR}"; exit 0; fi
          git rm -rq "pr-${PR}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove preview for PR #${PR}"
          git push origin gh-pages
