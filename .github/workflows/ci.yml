name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libgl1 libglib2.0-0

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Build every project (models, exports, drawings)
        run: cqp check

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 14
